name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # LLM evaluation is excluded so CI remains deterministic and offline.
      - run: python scripts/scan_secrets.py --history --staged
      - run: make check