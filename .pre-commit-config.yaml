repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: Scan full history and staged secrets
        entry: python scripts/scan_secrets.py --history --staged
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
      - id: ruff-format